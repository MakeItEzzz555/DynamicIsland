name: Agent Continuation CI

on:
  push:
    branches:
      - main
      - feature/agent-activity-chatgpt-continuation
      - feature/agent-activity-finalize
      - feature/agents-ui-overhaul-continuation
  pull_request:
    branches:
      - main
      - fix/live-activities
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-continuation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Diff hygiene
        run: git diff --check HEAD^

      - name: Debug build
        run: swift build

      # The macos-15 image enables Reduce Motion, under which visualizers
      # correctly hold still; live-frame rendering tests need a default Mac.
      - name: Allow motion
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          test "$(defaults read com.apple.universalaccess reduceMotion)" = 0

      # App activation is cooperative on macOS 14+; after thousands of window
      # tests the runner declines it, so the strict Settings pointer fixture
      # runs alone in a fresh XCTest process (next step), unchanged.
      - name: Tests
        shell: bash
        run: |
          set +e
          swift test --skip 'SettingsWindowTests/testSettingsWindowAcceptsLocalPointerEventsThroughItsNativeHierarchy'
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::macOS XCTest crash diagnostics"
            find "$HOME/Library/Logs/DiagnosticReports" -type f \
              \( -name 'xctest*.ips' -o -name 'xctest*.crash' -o -name 'swift-test*.ips' \) \
              -mmin -10 -print -exec cat {} \; 2>/dev/null || true
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Settings native pointer (fresh process)
        shell: bash
        run: |
          set -o pipefail
          swift test --filter 'SettingsWindowTests/testSettingsWindowAcceptsLocalPointerEventsThroughItsNativeHierarchy' 2>&1 | tee settings-pointer.log
          # A renamed test must not turn this required step into a silent no-op.
          grep -q "Executed 1 test, with 0 failures" settings-pointer.log

      - name: Release build
        run: swift build -c release

      - name: Package app
        run: |
          chmod +x Scripts/package_app.sh
          Scripts/package_app.sh

      - name: Verify helper signatures
        run: |
          codesign --verify --strict dist/DynamicIsland.app/Contents/Helpers/DynamicIslandAgentRelay
          codesign --verify --strict dist/DynamicIsland.app/Contents/Helpers/DynamicIslandCodexHookRelay
          codesign --verify --strict dist/DynamicIsland.app/Contents/Helpers/DynamicIslandClaudeHookRelay

      - name: Verify app signature
        run: codesign --verify --deep --strict dist/DynamicIsland.app
