name: Agent Continuation CI

on:
  push:
    branches:
      - feature/agent-activity-chatgpt-continuation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Diff hygiene
        run: git diff --check HEAD^

      - name: Debug build
        run: swift build

      - name: Tests
        run: swift test

      - name: Release build
        run: swift build -c release

      - name: Package app
        run: |
          chmod +x Scripts/package_app.sh
          Scripts/package_app.sh

      - name: Verify relay signature
        run: codesign --verify --strict dist/DynamicIsland.app/Contents/Helpers/DynamicIslandAgentRelay

      - name: Verify app signature
        run: codesign --verify --deep --strict dist/DynamicIsland.app
