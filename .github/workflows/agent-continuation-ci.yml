name: Agent Continuation CI

on:
  push:
    branches:
      - main
      - feature/agent-activity-chatgpt-continuation
      - feature/agent-activity-finalize
      - feature/agents-ui-overhaul-continuation
  pull_request:
    branches:
      - main
      - fix/live-activities
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-continuation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Environment probe
        run: |
          defaults read com.apple.universalaccess reduceMotion || echo "reduceMotion unset"
          defaults read com.apple.universalaccess reduceTransparency || echo "reduceTransparency unset"
          system_profiler SPDisplaysDataType | sed -n 1,30p

      - name: Build tests
        run: swift build --build-tests

      - name: Probe audio
        continue-on-error: true
        run: for i in 1 2 3; do swift test --skip-build --filter AudioWidgetIntegrationTests 2>&1 | grep -E "error|Executed .* tests"; done

      - name: Probe settings fresh process
        continue-on-error: true
        run: for i in 1 2 3; do swift test --skip-build --filter SettingsWindowTests/testSettingsWindowAcceptsLocalPointerEventsThroughItsNativeHierarchy 2>&1 | grep -E "error|Executed .* tests"; done

      - name: Probe intermittent
        continue-on-error: true
        run: for i in 1 2 3 4 5; do swift test --skip-build --filter "FileDropZoneTests|SystemNotificationMonitorResilienceTests" 2>&1 | grep -E "error|Executed .* tests"; done
